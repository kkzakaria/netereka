name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Une seule revue en vol par PR : une poussée de correctif annule celle en cours
# plutôt que d'en empiler une seconde sur du code déjà remplacé.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # DEUX AUTEURS EXCLUS, POUR DEUX RAISONS DIFFÉRENTES.
    #
    # release-please (github-actions[bot]) : ses PR ne portent qu'un CHANGELOG
    # et un numéro de version. Rien à relire.
    #
    # Dependabot : ses PR tournent avec un jeton RESTREINT qui n'a pas accès
    # aux `secrets` du dépôt. Ce travail échouait donc à chaque montée de
    # version — pas parce qu'il avait trouvé quelque chose, mais parce qu'il
    # ne pouvait pas démarrer. Un contrôle rouge en permanence n'informe plus
    # personne, il apprend à être ignoré : c'est le même raisonnement que
    # pour le garde-fou de dérive, qu'on a tenu à livrer vert.
    #
    # Ce que cela NE veut pas dire : qu'une montée de version n'est pas
    # relue. Lint, types, tests et CodeQL tournent toujours dessus, et
    # `npm ci` + `npm run build` restent la vraie épreuve d'un changement de
    # dépendance — ce qu'une relecture de `package-lock.json` ne donnerait
    # pas. Pour demander la revue sur une PR Dependabot précise, @claude dans
    # un commentaire, qui passe par claude.yml et son jeton complet.
    #
    # (Pour filtrer par auteur humain, c'est ici :
    # github.event.pull_request.author_association.)
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Épinglé au commit, voir claude.yml.
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

