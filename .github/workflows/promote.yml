name: Promote to 100%

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Cloudflare Worker Version ID (empty = auto-detect latest non-100%)"
        required: false
        default: ""

jobs:
  promote:
    name: Promote version to 100% of traffic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve target version_id
        id: resolve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_VERSION_ID: ${{ github.event.inputs.version_id }}
        run: |
          if [ -n "$INPUT_VERSION_ID" ]; then
            echo "version_id=$INPUT_VERSION_ID" >> "$GITHUB_OUTPUT"
          else
            # Pick the version actively in the current canary split
            # (0 < percentage < 100). We must NOT use `wrangler versions list`
            # here because that includes uploaded-but-never-deployed versions
            # whose `deployed_percentage` defaults to 0 — auto-promoting one of
            # those would bypass canary entirely and route 100% of traffic to
            # an untested version.
            # `wrangler deployments list --json` returns ASCENDING order
            # (oldest first), so `.[0]` is the oldest deployment — never the
            # current canary. Sort by created_on desc and take the most recent
            # deployment, then pick the version in the canary split.
            #
            # During a canary BOTH versions sit strictly between 0 and 100
            # (10% new / 90% previous), so "0 < pct < 100 then take the first"
            # is decided purely by the order Cloudflare happens to return the
            # array in — and picking the 90% entry would promote the PREVIOUS
            # version to 100%: a rollback carried out under the name of a
            # promotion, with nothing in the logs to say so.
            #
            # Identify the canary positively instead: it is the version in the
            # current split that was NOT part of the previous deployment.
            # Fall back to the smallest percentage only if that comparison
            # yields nothing (e.g. no previous deployment to compare against),
            # since deploy.yml always introduces the new version at 10%.
            VID=$(npx wrangler deployments list --json \
              | jq -r 'sort_by(.created_on) | reverse
                       | (.[0].versions // []) as $cur
                       | ((.[1].versions // []) | map(.version_id)) as $prev
                       | ($cur | map(select((.percentage // 0) > 0 and (.percentage // 0) < 100))) as $split
                       | ( ($split | map(select(.version_id as $v | ($prev | index($v)) | not)))
                           + ($split | sort_by(.percentage // 0)) )
                       | first
                       | .version_id')
            if [ -z "$VID" ] || [ "$VID" = "null" ]; then
              echo "ERROR: no canary version (0 < % < 100) found to promote." \
                   "If you want to deploy a fresh version, use deploy.yml first."
              exit 1
            fi
            echo "version_id=$VID" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy at 100%
        env:
          VERSION_ID: ${{ steps.resolve.outputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions deploy "${VERSION_ID}@100%" --yes

      - name: Seed hero LCP preload KV
        run: node scripts/seed-hero-preload.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL }}

      - name: Close pending-promotion issues
        uses: actions/github-script@v7
        env:
          VERSION_ID: ${{ steps.resolve.outputs.version_id }}
        with:
          script: |
            const versionId = process.env.VERSION_ID;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "pending-promotion",
              state: "open",
            });
            for (const issue of issues.data) {
              if (issue.body && issue.body.includes(versionId)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Promoted to 100% by @${context.actor}.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              }
            }
