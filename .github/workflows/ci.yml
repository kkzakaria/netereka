name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config, so
      # the repo code this job then runs (npm ci and its postinstall scripts)
      # can't read it back out. Safe here despite fetch-depth: 0 — that flag
      # makes checkout fetch every ref up front, and check-migration-safety.mjs
      # only ever runs `git diff` against refs already on disk. Nothing in this
      # job fetches or pushes after checkout, so the token has no reader left.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # needed for migration-safety diff base (origin/<base>...HEAD)

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        # LA GRAINE DOIT ÊTRE LISIBLE SANS FOUILLER LES JOURNAUX.
        #
        # L'ordre des tests est tiré au sort (`sequence.shuffle`,
        # vitest.config.ts) : un rouge peut n'apparaître qu'à un tirage sur
        # dix, et il se REJOUE avec `--sequence.seed=<n>`. Si la graine n'est
        # pas sous la main, le réflexe devient « je relance », et une
        # dépendance d'ordre réelle passe pour un caprice. On la met donc
        # dans le résumé du travail, avec la marche à suivre.
        #
        # Et surtout : PAS de `retry` ici, jamais. Il transformerait ce
        # signal en bruit.
        run: |
          set -o pipefail
          # `set +e` indispensable : GitHub lance `run:` avec `bash -e`, donc
          # un test rouge sortirait AVANT l'écriture du résumé — au moment
          # précis où la graine sert à quelque chose.
          set +e
          npm test 2>&1 | tee /tmp/vitest.log
          code=$?
          set -e
          graine=$(grep -oE 'seed "[0-9]+"' /tmp/vitest.log | head -1 | grep -oE '[0-9]+' || true)
          {
            echo "## Tests"
            echo
            echo "Graine du tirage : \`${graine:-inconnue}\`"
            echo
            echo 'Pour rejouer cet ordre exact : `npx vitest run --sequence.seed='"${graine:-N}"'`'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Migration safety lint
        run: node scripts/check-migration-safety.mjs

  worker-boot:
    # LE WORKER CONSTRUIT DÉMARRE-T-IL ? Le 2026-11-22, Next 16.4.6 avec
    # OpenNext 1.20.7 a passé types, lint, tests et `build:worker` au vert,
    # puis répondu 500 / erreur 1101 sur TOUTES les routes du canari : le
    # défaut vivait dans le code d'OpenNext, qu'aucun test unitaire n'exécute.
    # Ce job lance le bundle sous `wrangler dev --local` et lui demande des
    # pages (sondes et raisons : lib/release/demarrage.ts).
    #
    # AUCUN SECRET, À DESSEIN. Le défaut est arrivé par une PR de Dependabot,
    # qui n'a pas accès aux secrets du dépôt : ce job doit donc tourner sans.
    # `--local` coupe les liaisons distantes, la base est une D1 jetable
    # migrée depuis drizzle/, les secrets d'exécution sont factices.
    name: Démarrage du Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build worker
        run: npm run build:worker
        env:
          # NON VIDE, et c'est tout ce qui compte ici : sans elle, le layout de
          # la vitrine n'appelle pas `headers()`, toutes les routes deviennent
          # statiques, et le pré-rendu échoue sur D1 — un build qui ne
          # ressemble plus à celui de production. Valeur publique en repli,
          # pour une PR qui ne verrait pas les variables du dépôt.
          NEXT_PUBLIC_R2_URL: ${{ vars.NEXT_PUBLIC_R2_URL || 'https://r2.netereka.ci' }}
          # Clé de site de TEST publiée par Cloudflare : la vraie n'a rien à
          # faire dans une vérification.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Le Worker démarre et sert ses routes témoins
        run: npm run check:demarrage
